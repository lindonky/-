plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alwaysbea.esc'
    compileSdk 34

    defaultConfig {
        applicationId "com.alwaysbea.esc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯框架实现，无第三方依赖
}
